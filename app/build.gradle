plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
//    id 'com.google.gms.google-services'
    id 'kotlin-kapt' // 必须添加 kapt 插件
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace "com.findhiddencamera.spycameralocator"
    compileSdk project.COMPILE_SDK_VERSION as int

    defaultConfig {
        applicationId "com.findhiddencamera.spycameralocator"
        minSdk project.MIN_SDK_VERSION as int
        targetSdk project.TARGET_SDK_VERSION as int
        versionCode project.APP_VERSION_CODE as int
        versionName "${APP_VERSION_NAME}"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        ndk {
            //'x86', 'x86_64'：Intel架构，曾经被许多PC和一些Android设备使用
            //noinspection ChromeOsAbiSupport
            abiFilters 'armeabi-v7a', 'arm64-v8a' // 仅支持这两个架构
        }
    }

    signingConfigs {
        //release版本,打包机配置
        release {
            storeFile file("$rootDir$KEY_STORE_PATH")
            storePassword project.KEY_STORE_PWD
            keyAlias project.KEY_STORE_ALIAS
            keyPassword project.KEY_STORE_PWD
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions = ["appConfig"]
    productFlavors {
        //正式版
        prodVersion {
            dimension "appConfig"
            manifestPlaceholders = ['useHttp': false]
            buildConfigField("boolean", "isVideoTest", "false")
            proguardFile 'log-proguard-rules.pro' //正式版本混淆掉日志
        }
        //内网版
        innerVersion {
            dimension "appConfig"
            manifestPlaceholders = ['useHttp': true]
            buildConfigField("boolean", "isVideoTest", "false")
        }
        //开发版
        devVersion {
            dimension "appConfig"
            manifestPlaceholders = ['useHttp': false]
            buildConfigField("boolean", "isVideoTest", "false")
        }
        // TODO 临时测试包配置：测试完成后删除 qaVersion flavor，避免误发改包名版本。
        qaVersion {
            dimension "appConfig"
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
            matchingFallbacks = ['devVersion']
            manifestPlaceholders = ['useHttp': true]
            buildConfigField("boolean", "isVideoTest", "false")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }
}

dependencies {

    implementation "androidx.core:core-ktx:${KTX_CORE_VERSION}"
    implementation "androidx.appcompat:appcompat:${ANDROIDX_APPCOMPAT_VERSION}"
    implementation "androidx.activity:activity-ktx:${ANDROID_X_VERSION}"
    implementation "com.google.android.material:material:${MATERIAL_VERSION}"
    implementation libs.androidx.activity

    //================================compose dependencies area==============================
    def composeBom = platform('androidx.compose:compose-bom:2025.06.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation("androidx.activity:activity-compose:1.9.3")
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-graphics")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.wear.compose:compose-material:1.4.1")
    implementation("androidx.compose.material:material")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.navigation:navigation-compose:$NAV_VERSION")
    androidTestImplementation("androidx.compose.ui:ui-test-junit4")
    debugImplementation("androidx.compose.ui:ui-tooling")
    debugImplementation("androidx.compose.ui:ui-test-manifest")
    implementation 'androidx.compose.runtime:runtime-livedata'

    implementation 'androidx.multidex:multidex:2.0.1'
    //================================compose dependencies area==============================
    implementation "com.blankj:utilcode:${UTILS_VERSION}"
    implementation "com.github.skydoves:bundler:1.0.4"
    implementation 'com.github.stealthcopter:AndroidNetworkTools:0.4.5.3'
    implementation 'com.google.android.play:review:2.0.2'
    implementation "com.google.code.gson:gson:${GSON_VERSION}"

    //高斯模糊
    implementation 'com.github.centerzx:ShapeBlurView:1.0.5'
    implementation "dev.chrisbanes.haze:haze-materials:0.9.0-rc03" //compose 使用的动态模糊库，性能开销小，仅支持33以上

    //==========================room==========================
    implementation("androidx.room:room-runtime:$ROOM_VERSION")
    implementation("androidx.room:room-ktx:${ROOM_VERSION}")
//    annotationProcessor("androidx.room:room-compiler:$ROOM_VERSION")
    // To use Kotlin annotation processing tool (kapt)
    ksp("androidx.room:room-compiler:$ROOM_VERSION")

    // CameraX 1.5.2 的 native so 已按 16 KB page size 对齐，避免 Google Play 兼容性拦截
    def camerax_version = "1.5.2"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    // ProcessCameraProvider 的公开 API 使用 ListenableFuture，需显式提供其实现。
    implementation "androidx.concurrent:concurrent-futures:1.2.0"
    // Firebase Analytics 仅在运行时传递 Guava，CameraX 编译期也需要 ListenableFuture。
    implementation "com.google.guava:guava:31.1-android"
    //=========================================libs=========================================
    implementation project(path: ':Libs:Base')
    implementation project(path: ':Libs:Permission')
    implementation project(path: ':Libs:GPay')
    implementation project(path: ':Libs:FirebaseAnalytics')

}
